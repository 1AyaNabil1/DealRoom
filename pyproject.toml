# Tool configuration only; dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes + core pycodestyle errors, bugbear, and asyncio pitfalls
# (blocking calls inside async functions).
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
